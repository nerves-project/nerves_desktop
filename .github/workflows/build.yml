name: "Build Nightly Release"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_changes:
    name: "Check for changes"
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check and Prep
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all tags to find 'nightly'
          git fetch --tags || true

          # Get the SHA of the current HEAD
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Current SHA: $CURRENT_SHA"

          # Get the SHA of the 'nightly' tag if it exists
          NIGHTLY_SHA=$(git rev-parse nightly 2>/dev/null || echo "")
          echo "Nightly SHA: $NIGHTLY_SHA"

          if [ "$CURRENT_SHA" = "$NIGHTLY_SHA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No changes since last nightly build."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected or manual run. Preparing nightly release."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Delete old release and tag if they exist to ensure a fresh nightly build at the new SHA
            gh release delete nightly --yes --cleanup-tag || true
          fi

  app:
    needs: check_changes
    if: needs.check_changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/app-build.yml
    secrets: inherit
    with:
      tag_name: nightly
      release_name: "Nightly Release"
      release_body: "Automated nightly build from main branch."
      prerelease: true
      release_draft: false
      release_build: false
